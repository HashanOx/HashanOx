<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Animated mindset: Learn by building, understand by experimenting, improve through iteration">
<defs><linearGradient id="g"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="2" y="2" width="1196" height="186" rx="18" fill="#0D0D18" stroke="#39314F"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><g><circle cx="210" cy="78" r="27" fill="#211B38" stroke="#A78BFA" stroke-width="2"/><text x="210" y="86" fill="#D8B4FE" font-size="24">01</text><text x="210" y="137" fill="#F4F4F8" font-size="23" font-weight="700">LEARN BY BUILDING</text><circle cx="210" cy="78" r="35" fill="none" stroke="#A78BFA" opacity=".6"><animate attributeName="r" values="30;42;30" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="3s" repeatCount="indefinite"/></circle></g>
<path d="M390 78H475" stroke="url(#g)" stroke-width="2" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1.5s" repeatCount="indefinite"/></path><g><circle cx="600" cy="78" r="27" fill="#211B38" stroke="#22D3EE" stroke-width="2"/><text x="600" y="86" fill="#67E8F9" font-size="24">02</text><text x="600" y="137" fill="#F4F4F8" font-size="23" font-weight="700">UNDERSTAND BY EXPERIMENTING</text><circle cx="600" cy="78" r="35" fill="none" stroke="#22D3EE" opacity=".6"><animate attributeName="r" values="30;42;30" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="3s" begin="1s" repeatCount="indefinite"/></circle></g>
<path d="M790 78H875" stroke="url(#g)" stroke-width="2" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1.5s" repeatCount="indefinite"/></path><g><circle cx="1000" cy="78" r="27" fill="#211B38" stroke="#A78BFA" stroke-width="2"/><text x="1000" y="86" fill="#D8B4FE" font-size="24">03</text><text x="1000" y="137" fill="#F4F4F8" font-size="23" font-weight="700">IMPROVE THROUGH ITERATION</text><circle cx="1000" cy="78" r="35" fill="none" stroke="#A78BFA" opacity=".6"><animate attributeName="r" values="30;42;30" dur="3s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="3s" begin="2s" repeatCount="indefinite"/></circle></g></g></svg>